<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2EBFB5"/>
      <stop offset="100%" style="stop-color:#6BE0BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <!-- Stretching figure - side bend pose -->
  <g fill="rgba(255,255,255,0.95)" transform="translate(512, 512)">
    <!-- Head -->
    <circle cx="0" cy="-280" r="65"/>
    <!-- Neck -->
    <path d="M-20,-215 L20,-215 L25,-190 L-25,-190 Z"/>
    <!-- Torso with side bend -->
    <path d="M-90,-190 Q-70,-100 -50,20 L-65,80 L65,80 Q85,-20 100,-190 Q60,-190 0,-190 Z"/>
    <!-- Left arm reaching over -->
    <path d="M-85,-175 Q-120,-280 0,-320 Q80,-340 150,-280 L145,-255 Q75,-310 0,-295 Q-95,-260 -70,-170 Z"/>
    <!-- Hand -->
    <circle cx="148" cy="-268" r="22"/>
    <!-- Right arm on hip -->
    <path d="M95,-170 Q120,-80 75,60 L55,55 Q95,-70 75,-160 Z"/>
    <!-- Left leg -->
    <path d="M-55,80 L-25,80 L-10,300 L-60,300 Z"/>
    <!-- Right leg -->
    <path d="M25,80 L55,80 L60,300 L10,300 Z"/>
    <!-- Feet -->
    <rect x="-70" y="295" width="55" height="18" rx="9"/>
    <rect x="15" y="295" width="55" height="18" rx="9"/>
  </g>
</svg>
