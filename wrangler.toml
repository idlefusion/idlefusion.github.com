#:schema node_modules/wrangler/config-schema.json
name = "idlefusion-website"
compatibility_date = "2026-02-14"
main = "worker.ts"

[assets]
directory = "./dist"
# worker.ts hands every non-API request to env.ASSETS; without this binding it
# throws, and unknown URLs return Cloudflare error 1101 instead of the 404 page.
binding = "ASSETS"
not_found_handling = "404-page"

[[routes]]
pattern = "idlefusion.com"
custom_domain = true

[[routes]]
pattern = "www.idlefusion.com"
custom_domain = true

# Cookieless conversion and page-view counts (see docs/analytics.md).
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "idlefusion_events"
